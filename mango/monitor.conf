# monitor.conf -- regras de monitor DESTA máquina (não versionado).
#
# Gerado/ajustado localmente. Para regenerar a partir da sessão atual:
#   ~/.config/scripts/detect-monitors.sh --write
#   mmsg dispatch reload_config
#
# Sem nenhuma regra o mango detecta os monitores e usa o modo preferido de
# cada um. Veja a sintaxe completa em:
# https://github.com/mangowm/mango/wiki/monitors

monitor_rule=name:^eDP-1$,width:1366,height:768,refresh:60,x:0,y:0,scale:1,vrr:0,rr:0
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:100,x:1366,y:0,scale:1,vrr:0,rr:0
