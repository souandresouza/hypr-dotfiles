font_family = JetBrainsMono Nerd Font
wallpaper = "/home/andre/.cache/current_wallpaper.png"
profile = /home/andre/Documentos/user.png
inner_color  = rgba(6, 17, 14, 1.0)
border_color = rgba(164, 196, 194, 1.0)
gradient = rgba(90, 77, 66, 1.0) rgba(164, 196, 194, 1.0) 45deg

general {
    ignore_empty_input = true
    hide_cursor = true
    fail_timeout = 300
}

# Background
background {
    monitor =
    path = /home/andre/.cache/current_wallpaper.png
    brightness = 0.5
    blur_passes = 2
    blur_size = 7
}

# Profile Picture
image {
    monitor =
    path = /home/andre/Documentos/user.png
    size = 110
    rounding = 10
    border_size = 4
    border_color = rgba(164, 196, 194, 1.0)

    position = 20, -20
    halign = left
    valign = top
    zindex = 1
}

# User Info
label {
    monitor =
    text = cmd[update:1000000] /home/andre/.config/scripts/contador_pacotes.sh
    shadow_boost = 0.5
    shadow_passes = 1
    color = rgba(255, 255, 255, 1.0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font

    position = 170, -35
    halign = left
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] LC_TIME=pt_BR.UTF-8 date +"<b> %A, %-d %B %Y </b>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# TIME HR
label {
    monitor =
    text = cmd[update:1000] date +"%H:"
    color = rgba(255, 255, 255, 1.0)
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 200
    font_family = JetBrainsMono Nerd Font
    position = -410, -10
    halign = center
    valign = center
    zindex = 5
}

# TIME MIN
label {
    monitor =
    text = cmd[update:1000] date +"%M:"
    color = rgba(255, 255, 255, 1.0)
    font_size = 200
    font_family = JetBrainsMono Nerd Font
    position = 10, -15
    halign = center
    valign = center
    zindex = 5
}

# TIME SEC
label {
    monitor =
    text = cmd[update:1000] date +"%S"
    color = rgba(255, 255, 255, 1.0)
    shadow_size = 3
    shadow_color = rgb(0,0,0)
