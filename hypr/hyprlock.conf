}

# Input Field
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(90, 77, 66, 1.0) rgba(164, 196, 194, 1.0) 45deg
    inner_color = rgba(6, 17, 14, 1.0)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Digite a senha...</i>
    hide_input = false
    rounding = -1
    check_color = rgba(164, 196, 194, 1.0)
    fail_color = rgb(204,34,34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(90, 77, 66, 1.0)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -200
    halign = center
    valign = center
}

